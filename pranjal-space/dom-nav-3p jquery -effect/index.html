<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <button id="before" class="btn btn-outline-success my-5">Before-img</button>
    <button id="after" class="btn btn-outline-info my-5">After-img</button>
    <button id="toggle" class="btn btn-outline-warning">Toggle-img </button>
    <button id="animate" class="btn btn-outline-secondary">Animate</button>

    <!-- closing image -->
    <div id="image-before">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRVYiBjcJsk70zuW276Dz62N1x2P29Y0qqP7w&s" alt="" height="300px" width="300px" style="object-fit: contain; position: absolute;">
    </div>
    <!-- open image -->
    <div id="image-after">
        <img src="https://png.pngtree.com/png-vector/20240816/ourmid/pngtree-colorful-bird-clipart-illustration-cute-cartoon-animal-for-and-web-png-image_13508551.png" alt="" height="320px" width="320px" style="object-fit: contain;  position: relative; top: 6px; right: 39px;">
    </div>
    <!-- toggle-img -->
    <div id="toggle-img">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT8BuQohW6Cl6-z3plMgazfjxALsSlpz_XzmA&s" alt="" height="320px" width="320px" style="object-fit: contain; ">
    </div>
    <script src="./app/app.js"></script>
</body>
</html>
