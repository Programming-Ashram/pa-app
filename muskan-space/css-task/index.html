<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grouped Selectors in CSS</title>
    <style>
        /* Grouping multiple selectors */
        h1, h2, p {
            color: blue;
            font-family: Arial, sans-serif;
            text-align: center;
        }
         /* Grouping classes and ID */
        .container, .box, #main {
            background-color: lightgray;
            padding: 20px;
            border-radius: 10px;
            margin: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Welcome to My Website</h1>
    <h2>CSS Grouped Selectors Example</h2>
    <p>This is a paragraph demonstrating grouped CSS selectors.</p>

    <div class="container">This is a container</div>
    <div class="box">This is a box</div>
    <div id="main">This is the main section</div>
</body>
</html>
