<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us Form</title>
  <style>
    body {
      background-color: #e6f4ec;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      padding: 40px;
    }
    .contact-form {
      background
      -color: #fff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
      max-width: 600px;
      width: 100%;
    }
    h2 {
      margin-bottom: 20px;
      color: #2d2d2d;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-row {
      display: flex;
      gap: 10px;
    }
    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #b0c4b1;
      border-radius: 8px;
      font-size: 14px;
    }
    textarea {
      resize: vertical;
      height: 100px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      color: #333;
    }
    .radio-group {
      display: flex;
      gap: 10px;
    }
    .radio-option {
      flex: 1;
      border: 1px solid #b0c4b1;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .consent {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .submit-btn {
      background-color: #007a5c;
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    .submit-btn:hover {
      background-color: #00624c;
    }
  </style>
</head>
<body>
  <form class="contact-form">
    <h2>Contact Us</h2>

    <div class="form-row">
      <div class="form-group">
        <label for="first-name">First Name *</label>
        <input type="text" id="first-name" name="first-name" required>
      </div>
      <div class="form-group">
        <label for="last-name">Last Name *</label>
        <input type="text" id="last-name" name="last-name" required>
      </div>
    </div>
    <div class="form-group">
      <label for="email">Email Address *</label>
      <input type="email" id="email" name="email" required>
    </div>

    <div class="form-group">
      <label>Query Type *</label>
      <div class="radio-group">
        <label class="radio-option">
          <input type="radio" name="query-type" value="general" required>
          General Enquiry
        </label>
        <label class="radio-option">
          <input type="radio" name="query-type" value="support" required>
          Support Request
        </label>
      </div>
    </div>

    <div class="form-group">
      <label for="message">Message *</label>
      <textarea id="message" name="message" required></textarea>
    </div>

    <div class="mussu">
      <input type="checkbox" id="mussu" name="mussu" required>
      <label for="mussu">I consent to being contacted by the team *</label>
    </div>

    <button type="submit" class="submit-btn">Submit</button>
  </form>
</body>
</html>
